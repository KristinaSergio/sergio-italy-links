
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Серджио Итали — мы на связи</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
main{width:min(100% - 28px,560px);margin:auto;padding:30px 0 24px;text-align:center}
.logo{display:block;width:min(100%,390px);height:auto;margin:0 auto 12px}
h1{font-size:clamp(25px,7vw,38px);margin:12px 0;color:#f0eeee}
.tagline{color:#ed1828;font-weight:bold;letter-spacing:1px;font-size:clamp(12px,3.5vw,16px);margin:12px 0 26px}
.intro{font-size:18px;line-height:1.5;color:#eee;margin:24px 0}
.buttons{display:grid;gap:16px;margin-top:26px}
.btn{display:flex;align-items:center;gap:17px;text-align:left;text-decoration:none;color:#fff;padding:19px 16px;border:1px solid var(--c);border-radius:25px;background:linear-gradient(110deg,var(--bg),#090909 75%);min-height:105px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.icon{width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;border-radius:17px;background:var(--c);color:#fff;font-size:27px;font-weight:bold}
.label{font-size:22px;font-weight:bold}
.sub{display:block;color:#aaa;font-size:14px;margin-top:7px}
.arrow{margin-left:auto;color:var(--c);font-size:30px}
.wa{--c:#14d765;--bg:#07190f}
.tg{--c:#12a9ee;--bg:#061621}
.mx{--c:#8d3cff;--bg:#140b20}
.pizza{font-size:26px;letter-spacing:9px;margin:24px 0 12px}
.note{color:#aaa;font-size:14px;line-height:1.6;margin:20px 0}
footer{color:#777;font-size:12px;margin-top:26px}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Серджио Итали"
       onerror="this.style.display='none';document.getElementById('fallback').style.display='block'">
  <h1 id="fallback" style="display:none;color:#ed1828">Серджио Итали</h1>
  <div class="tagline">ПОПРОБУЙ. ВЛЮБИСЬ. ВЕРНИСЬ.</div>
  <p class="intro">Свяжитесь с нами удобным<br>для вас способом</p>

  <div class="buttons">
    <a class="btn wa" href="https://wa.me/79340633373" target="_blank" rel="noopener">
      <span class="icon">◉</span>
      <span><span class="label">WhatsApp</span><span class="sub">Написать в WhatsApp</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="btn tg" href="https://t.me/sergioitalypyatigorsk" target="_blank" rel="noopener">
      <span class="icon">➤</span>
      <span><span class="label">Telegram</span><span class="sub">Написать в Telegram</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="btn mx" href="https://max.ru/u/f9LHodD0cOLW79P3z-0fPEAp4dlPI-Whrdki_14C0xCtaz-HiHdqCu-X5Ko" target="_blank" rel="noopener">
      <span class="icon">●</span>
      <span><span class="label">MAX</span><span class="sub">Написать в MAX</span></span>
      <span class="arrow">›</span>
    </a>
  </div>

  <div class="pizza">🍕　🍕　🍕</div>
  <p class="note">Мы всегда на связи и готовы помочь!</p>
  <footer>© Серджио Итали. Все права защищены.</footer>
</main>
</body>
</html>
