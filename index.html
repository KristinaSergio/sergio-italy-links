<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Серджио Итали — свяжитесь с нами в WhatsApp, Telegram или MAX.">
  <title>Серджио Итали — заказать</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    main{width:min(100% - 32px,480px);margin:0 auto;padding:34px 0 36px;text-align:center}
    .brand{display:block;width:min(82%,310px);height:auto;margin:0 auto 20px;object-fit:contain}
    .brand-fallback{display:none;color:#e31927;font-size:32px;font-weight:800;margin:36px 0 22px}
    .intro{font-size:19px;line-height:1.45;margin:0 0 26px;color:#e9e9e9}
    .links{display:grid;gap:14px}
    .link{display:flex;align-items:center;gap:16px;min-height:98px;padding:17px 19px;text-decoration:none;color:#fff;border:1.5px solid var(--accent);border-radius:25px;background:linear-gradient(105deg,var(--tint),#0b0b0b 76%);text-align:left;transition:transform .15s,filter .15s}
    .link:active{transform:scale(.985)}
    .link:focus-visible{outline:3px solid white;outline-offset:3px}
    .symbol{width:58px;height:58px;border-radius:18px;flex:none;background:var(--accent);display:grid;place-items:center;font-size:29px;font-weight:bold;color:white}
    .copy{flex:1;min-width:0}
    .name{display:block;font-size:24px;font-weight:800;line-height:1.2}
    .hint{display:block;font-size:14px;color:#b8b8b8;margin-top:7px}
    .arrow{font-size:32px;color:var(--accent)}
    .wa{--accent:#10cf64;--tint:#092016}
    .tg{--accent:#18a8e8;--tint:#081e2b}
    .max{--accent:#903af4;--tint:#1c102a}
    .pizza{display:flex;justify-content:center;gap:42px;margin:26px 0 18px;font-size:29px}
    footer{font-size:13px;color:#858585;line-height:1.5}
    @media(max-width:360px){.link{padding:14px;gap:12px}.name{font-size:21px}.symbol{width:52px;height:52px}.intro{font-size:17px}}
  </style>
</head>
<body>
  <main>
    <img class="brand" src="logo.png" alt="Серджио Итали — Попробуй. Влюбись. Вернись." onerror="this.style.display='none';document.querySelector('.brand-fallback').style.display='block'">
    <div class="brand-fallback">Серджио Итали</div>
    <p class="intro">Свяжитесь с нами удобным<br>для вас способом</p>
    <nav class="links" aria-label="Мессенджеры для связи">
      <a class="link wa" href="https://wa.me/79340633373" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">✆</span><span class="copy"><span class="name">WhatsApp</span><span class="hint">Написать в WhatsApp</span></span><span class="arrow" aria-hidden="true">›</span></a>
      <a class="link tg" href="https://t.me/sergioitalypyatigorsk" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">➤</span><span class="copy"><span class="name">Telegram</span><span class="hint">Написать в Telegram</span></span><span class="arrow" aria-hidden="true">›</span></a>
      <a class="link max" href="https://max.ru/u/f9LHodD0cOLW79P3z-0fPEAp4dlPI-Whrdki_14C0xCtaz-HiHdqCu-X5Ko" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">●</span><span class="copy"><span class="name">MAX</span><span class="hint">Написать в MAX</span></span><span class="arrow" aria-hidden="true">›</span></a>
    </nav>
    <div class="pizza" aria-hidden="true"><span>🍕</span><span>🍕</span><span>🍕</span></div>
    <footer>Мы всегда на связи и готовы помочь!<br>© Серджио Итали. Все права защищены.</footer>
  </main>
</body>
</html>
